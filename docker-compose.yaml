# =============================================================================
# Kit Projet Airflow 3.1.8 - Formation IPSSI
# Services : Airflow (CeleryExecutor) + PostgreSQL DWH + MinIO + API Flask
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:3.2.0rc2-python3.14
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: formation-airflow-secret-key-2026
    # Connections pre-configurees via variables d'env
    AIRFLOW_CONN_POSTGRES_DWH: postgresql://dwh_user:dwh_password@postgres-dwh:5432/dwh
    AIRFLOW_CONN_POSTGRES_SOURCE: postgresql://source_user:source_password@postgres-source:5432/source_db
    AIRFLOW_CONN_MINIO_LOCAL: aws://minio_admin:minio_password_2026@?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1
    AIRFLOW_CONN_API_ECOMMERCE: http://api-simulee:5000@?headers=%7B%22Authorization%22%3A+%22Bearer+formation-token-2026%22%7D
    AIRFLOW_VAR_API_TOKEN: formation-token-2026
    AIRFLOW_VAR_API_BASE_URL: http://api-simulee:5000
    _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres apache-airflow-providers-amazon apache-airflow-providers-http apache-airflow-providers-celery boto3 requests
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./tests:/opt/airflow/tests
  depends_on:
    postgres-airflow:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - airflow-net

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Airflow Metadata DB
  # ---------------------------------------------------------------------------
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  # ---------------------------------------------------------------------------
  # PostgreSQL - DWH cible (port 5433)
  # ---------------------------------------------------------------------------
  postgres-dwh:
    image: postgres:16
    environment:
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: dwh_password
      POSTGRES_DB: dwh
    ports:
      - "5433:5432"
    volumes:
      - postgres-dwh-data:/var/lib/postgresql/data
      - ./init-db/init-dwh.sql:/docker-entrypoint-initdb.d/01-init-dwh.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh_user -d dwh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  # ---------------------------------------------------------------------------
  # PostgreSQL - Source DB (Sujet B)
  # ---------------------------------------------------------------------------
  postgres-source:
    image: postgres:16
    environment:
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_password
      POSTGRES_DB: source_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./init-db/init-source.sql:/docker-entrypoint-initdb.d/01-init-source.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_user -d source_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  # ---------------------------------------------------------------------------
  # Redis - Celery Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  # ---------------------------------------------------------------------------
  # MinIO - Object Storage (S3 compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  # ---------------------------------------------------------------------------
  # MinIO Init - Creer le bucket et deposer les CSV
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    entrypoint: /bin/sh
    command: /seed/init-marketplace.sh
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_2026
    volumes:
      - ./init-minio/init-marketplace.sh:/seed/init-marketplace.sh
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - airflow-net

  # ---------------------------------------------------------------------------
  # API Flask simulee
  # ---------------------------------------------------------------------------
  api-simulee:
    build:
      context: api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      API_TOKEN: formation-token-2026
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net

  # ---------------------------------------------------------------------------
  # Airflow Init
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{dags,logs,plugins,tests}
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname Formation \
          --role Admin \
          --email admin@formation.local || true
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    depends_on:
      postgres-airflow:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Airflow API Server (remplace Webserver en Airflow 3)
  # ---------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow Scheduler
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow DAG Processor
  # ---------------------------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow Triggerer
  # ---------------------------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow Worker (Celery)
  # ---------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-airflow-data:
  postgres-dwh-data:
  postgres-source-data:
  minio-data:

networks:
  airflow-net:
    driver: bridge
